events { worker_connections 1024; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream auth_up { zone auth_up 64k; server auth-service:80 resolve; }
  upstream patrimoine_up { zone patrimoine_up 64k; server patrimoine-service:80 resolve; }
  upstream localisation_up { zone localisation_up 64k; server localisation-service:80 resolve; }

  server {
    listen 80;
    client_max_body_size 20m;

    # ⏱️ TIMEOUTS POUR ÉVITER LES ERREURS 504
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Route pour l'authentification
    location /api/auth/ {
      proxy_pass http://auth_up/api/;
      proxy_set_header Host $http_host;
    }

    # Route pour l'API Patrimoine
    location /api/patrimoine/ {
      proxy_pass http://patrimoine_up/api/;
      proxy_set_header Host $http_host;
    }

    # Route pour l'API Localisation
    location /api/localisation/ {
      proxy_pass http://localisation_up/api/;
      proxy_set_header Host $http_host;
    }

    # Les fichiers CSS/JS Vite sont versionnés par empreinte de contenu.
    location ~* ^/build/assets/.+\.(?:css|js)$ {
      proxy_pass http://patrimoine_up;
      proxy_set_header Host $http_host;
      expires 1y;
      add_header Cache-Control 'public, immutable';
    }

    # Route pour l'interface Web (Frontend) à la racine
    location / {
      proxy_pass http://patrimoine_up/;
      proxy_set_header Host $http_host;
    }
  }
}