events { worker_connections 1024; }

http {
  upstream auth_up { server auth-service:80; }
  upstream patrimoine_up { server patrimoine-service:80; }
  upstream localisation_up { server localisation-service:80; }

  server {
    listen 80;
    client_max_body_size 20m;

    # ⏱️ TIMEOUTS POUR ÉVITER LES ERREURS 504
    proxy_connect_timeout 120s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    # Route pour l'authentification
    location /api/auth/ {
      proxy_pass http://auth_up/api/;
      proxy_set_header Host $http_host;
    }

    # Route pour l'API Patrimoine
    location /api/patrimoine/ {
      proxy_pass http://patrimoine_up/api/;
      proxy_set_header Host $http_host;
    }

    # Route pour l'API Localisation
    location /api/localisation/ {
      proxy_pass http://localisation_up/api/;
      proxy_set_header Host $http_host;
    }

    # Les fichiers CSS/JS Vite sont versionnés par empreinte de contenu.
    location ~* ^/build/assets/.+\.(?:css|js)$ {
      proxy_pass http://patrimoine_up;
      proxy_set_header Host $http_host;
      expires 1y;
      add_header Cache-Control 'public, immutable';
    }

    # Route pour l'interface Web (Frontend) à la racine
    location / {
      proxy_pass http://patrimoine_up/;
      proxy_set_header Host $http_host;
    }
  }
}
