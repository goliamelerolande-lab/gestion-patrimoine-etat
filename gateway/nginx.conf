events { worker_connections 1024; }

http {
  upstream auth_up { server auth-service:80; }
  upstream patrimoine_up { server patrimoine-service:80; }
  upstream localisation_up { server localisation-service:80; }

  server {
    listen 80;
    client_max_body_size 20m;

    location /api/auth/ {
      rewrite ^/api/auth/(.*)$ /api/$1 break;
      proxy_pass http://auth_up;
      proxy_set_header Host $host;
    }

    location /api/patrimoine/ {
      rewrite ^/api/patrimoine/(.*)$ /api/$1 break;
      proxy_pass http://patrimoine_up;
      proxy_set_header Host $host;
    }

    location /api/localisation/ {
      rewrite ^/api/localisation/(.*)$ /api/$1 break;
      proxy_pass http://localisation_up;
      proxy_set_header Host $host;
    }
  }
}