# ==============================================================================
# Configuration Render.com (Plan Gratuit / Free Tier)
# Déploiement automatique en 1 clic depuis GitHub
# GEST-PATRIMOINE — République Togolaise
# ==============================================================================

services:
  - type: web
    name: gest-patrimoine-togo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: "GEST-PATRIMOINE (République Togolaise)"
