<svg xmlns="http://www.w3.org/2000/svg" width="3420" height="1040" viewBox="0 0 3420 1040" role="img" aria-labelledby="title desc">
  <title id="title">Maquettes GPE : tableau de bord, utilisateurs et connexion</title>
  <desc id="desc">Planche vectorielle composée de trois écrans de l’application GPE, prête à importer dans Figma.</desc>
  <defs>
    <style>
      .ui{font-family:Inter,Arial,sans-serif}.h1{font-size:26px;font-weight:700;fill:#172b45}.h2{font-size:16px;font-weight:700;fill:#172b45}.body{font-size:13px;fill:#526174}.small{font-size:11px;fill:#65758a}.label{font-size:10px;font-weight:700;letter-spacing:1px;fill:#8793a3}.white{fill:#fff}.nav{fill:#d4dce7}.btn{font-size:12px;font-weight:700;fill:#fff}.green{fill:#176b5b}.navy{fill:#14263f}.stroke{stroke:#e4eaf0;stroke-width:1}
    </style>
  </defs>
  <rect width="3420" height="1040" fill="#edf2f4"/>
  <text x="70" y="62" class="ui" font-size="24" font-weight="700" fill="#14263f">GPE · Planche de conception MVP</text>
  <text x="70" y="90" class="ui" font-size="13" fill="#64748b">Gestion du Patrimoine de l’État · trois écrans à importer et adapter dans Figma</text>

  <!-- Dashboard frame -->
  <g transform="translate(70 130)" class="ui">
    <rect width="1040" height="850" rx="20" fill="#fff" stroke="#dce4e8"/>
    <rect width="1040" height="58" rx="20" fill="#fff"/><path d="M0 58h1040" class="stroke"/>
    <text x="24" y="36" class="h2">01 · Tableau de bord</text><text x="825" y="36" class="small">Frame 1040 × 850</text>
    <rect x="0" y="59" width="220" height="791" fill="#14263f"/>
    <rect x="23" y="82" width="38" height="38" rx="12" fill="#176b5b"/><text x="36" y="107" font-size="19" font-weight="700" fill="#fff">G</text><text x="72" y="107" font-size="20" font-weight="700" fill="#fff">GPE.</text>
    <text x="24" y="162" class="label" fill="#8fa0b7">MENU PRINCIPAL</text>
    <rect x="14" y="176" width="192" height="42" rx="10" fill="#1c3c53"/><text x="29" y="202" font-size="13" font-weight="700" fill="#fff">▦  Tableau de bord</text>
    <text x="29" y="251" class="nav">▣  Gestion des biens</text><text x="29" y="297" class="nav">⌖  Sites &amp; localisations</text><text x="29" y="343" class="nav">▤  Rapports globaux</text><text x="29" y="389" class="nav">♙  Utilisateurs</text><text x="29" y="435" class="nav">♧  Notifications</text>
    <text x="250" y="112" class="h1">Tableau de bord</text><text x="250" y="138" class="body">Vue synthétique du patrimoine enregistré</text>
    <rect x="250" y="165" width="235" height="125" rx="15" fill="#f5f8fa" stroke="#e5ebef"/><text x="272" y="196" class="label">VALEUR DU PATRIMOINE</text><text x="272" y="235" font-size="27" font-weight="700" fill="#14263f">750 000</text><text x="272" y="263" class="small">FCFA · tous les biens</text>
    <rect x="500" y="165" width="235" height="125" rx="15" fill="#f5f8fa" stroke="#e5ebef"/><text x="522" y="196" class="label">BIENS EN USAGE</text><text x="522" y="235" font-size="27" font-weight="700" fill="#14263f">8</text><text x="522" y="263" class="small">sur 12 biens enregistrés</text>
    <rect x="750" y="165" width="245" height="125" rx="15" fill="#f5f8fa" stroke="#e5ebef"/><text x="772" y="196" class="label">NOTIFICATIONS NON LUES</text><text x="772" y="235" font-size="27" font-weight="700" fill="#14263f">3</text><text x="772" y="263" class="small">à consulter</text>
    <rect x="250" y="315" width="745" height="480" rx="15" fill="#fff" stroke="#e5ebef"/><text x="275" y="353" class="h2">Derniers biens enregistrés</text><text x="275" y="378" class="small">Liste des actifs récemment ajoutés</text>
    <rect x="855" y="333" width="115" height="36" rx="10" fill="#176b5b"/><text x="870" y="356" class="btn">+ Nouveau bien</text>
    <rect x="270" y="405" width="705" height="42" rx="8" fill="#f5f8fa"/><text x="286" y="431" class="label">CODE</text><text x="410" y="431" class="label">LIBELLÉ</text><text x="700" y="431" class="label">VALEUR</text><text x="815" y="431" class="label">ÉTAT</text>
    <path d="M270 500h705M270 553h705M270 606h705M270 659h705M270 712h705" class="stroke"/>
    <text x="286" y="479" class="body">GPE-000012</text><text x="410" y="479" class="body">Ordinateur portable</text><text x="700" y="479" class="body">350 000 FCFA</text><text x="815" y="479" class="body">En usage</text>
    <text x="286" y="532" class="body">GPE-000011</text><text x="410" y="532" class="body">Mobilier de bureau</text><text x="700" y="532" class="body">250 000 FCFA</text><text x="815" y="532" class="body">Neuf</text>
    <text x="286" y="585" class="body">GPE-000010</text><text x="410" y="585" class="body">Imprimante réseau</text><text x="700" y="585" class="body">150 000 FCFA</text><text x="815" y="585" class="body">En usage</text>
    <text x="286" y="638" class="body">GPE-000009</text><text x="410" y="638" class="body">Chaise visiteur</text><text x="700" y="638" class="body">45 000 FCFA</text><text x="815" y="638" class="body">Bon</text>
    <text x="286" y="691" class="body">GPE-000008</text><text x="410" y="691" class="body">Onduleur</text><text x="700" y="691" class="body">95 000 FCFA</text><text x="815" y="691" class="body">En usage</text>
    <text x="275" y="763" class="small">Les chiffres de la maquette sont illustratifs.</text>
  </g>

  <!-- Users frame -->
  <g transform="translate(1190 130)" class="ui">
    <rect width="1040" height="850" rx="20" fill="#fff" stroke="#dce4e8"/>
    <rect width="1040" height="58" rx="20" fill="#fff"/><path d="M0 58h1040" class="stroke"/>
    <text x="24" y="36" class="h2">02 · Utilisateurs</text><text x="825" y="36" class="small">Frame 1040 × 850</text>
    <rect x="0" y="59" width="220" height="791" fill="#14263f"/>
    <rect x="23" y="82" width="38" height="38" rx="12" fill="#176b5b"/><text x="36" y="107" font-size="19" font-weight="700" fill="#fff">G</text><text x="72" y="107" font-size="20" font-weight="700" fill="#fff">GPE.</text>
    <text x="29" y="202" class="nav">▦  Tableau de bord</text><text x="29" y="251" class="nav">▣  Gestion des biens</text><text x="29" y="297" class="nav">⌖  Sites &amp; localisations</text><text x="29" y="343" class="nav">▤  Rapports globaux</text>
    <rect x="14" y="365" width="192" height="42" rx="10" fill="#1c3c53"/><text x="29" y="391" font-size="13" font-weight="700" fill="#fff">♙  Utilisateurs</text><text x="29" y="443" class="nav">♧  Notifications</text>
    <text x="250" y="112" class="h1">Espace utilisateurs</text><text x="250" y="138" class="body">Comptes enregistrés dans le service d’authentification</text><text x="250" y="164" class="small">Connecté : Administrateur · admin@etat.gouv</text>
    <rect x="250" y="188" width="745" height="55" rx="12" fill="#edf7f4" stroke="#c9e6dc"/><text x="270" y="222" class="body">Accès protégé · mots de passe hachés · comptes désactivables</text>
    <rect x="832" y="108" width="165" height="40" rx="10" fill="#176b5b"/><text x="851" y="133" class="btn">+ Nouvel utilisateur</text>
    <rect x="250" y="268" width="745" height="455" rx="15" fill="#fff" stroke="#e5ebef"/><rect x="270" y="290" width="705" height="46" rx="8" fill="#f5f8fa"/>
    <text x="286" y="319" class="label">NOM</text><text x="460" y="319" class="label">EMAIL</text><text x="680" y="319" class="label">RÔLE</text><text x="790" y="319" class="label">STATUT</text>
    <path d="M270 399h705M270 462h705M270 525h705M270 588h705" class="stroke"/>
    <text x="286" y="375" class="body">Administrateur</text><text x="460" y="375" class="body">admin@etat.gouv</text><rect x="680" y="355" width="73" height="25" rx="12" fill="#e5edff"/><text x="696" y="372" font-size="11" font-weight="700" fill="#2453a6">Admin</text><rect x="790" y="355" width="65" height="25" rx="12" fill="#dcf4e8"/><text x="804" y="372" font-size="11" font-weight="700" fill="#176b5b">Actif</text><text x="880" y="374" class="small">Modifier</text>
    <text x="286" y="438" class="body">Agent de gestion</text><text x="460" y="438" class="body">agent@etat.gouv</text><rect x="680" y="418" width="73" height="25" rx="12" fill="#eef2f5"/><text x="696" y="435" font-size="11" font-weight="700" fill="#526174">Agent</text><rect x="790" y="418" width="65" height="25" rx="12" fill="#dcf4e8"/><text x="804" y="435" font-size="11" font-weight="700" fill="#176b5b">Actif</text><text x="880" y="437" class="small">Modifier</text>
    <text x="286" y="501" class="body">Compte inactif</text><text x="460" y="501" class="body">ancien@etat.gouv</text><rect x="680" y="481" width="73" height="25" rx="12" fill="#eef2f5"/><text x="696" y="498" font-size="11" font-weight="700" fill="#526174">Agent</text><rect x="790" y="481" width="85" height="25" rx="12" fill="#f1f2f4"/><text x="801" y="498" font-size="11" font-weight="700" fill="#6b7280">Désactivé</text><text x="900" y="500" class="small">Activer</text>
    <rect x="250" y="754" width="745" height="55" rx="12" fill="#fff7e8" stroke="#f5dfb6"/><text x="270" y="788" class="body">Le dernier administrateur actif ne peut pas être désactivé.</text>
  </g>

  <!-- Login frame -->
  <g transform="translate(2310 130)" class="ui">
    <rect width="1040" height="850" rx="20" fill="#fff" stroke="#dce4e8"/>
    <rect width="1040" height="58" rx="20" fill="#fff"/><path d="M0 58h1040" class="stroke"/>
    <text x="24" y="36" class="h2">03 · Connexion</text><text x="825" y="36" class="small">Frame 1040 × 850</text>
    <rect x="0" y="59" width="510" height="791" fill="#14263f"/>
    <rect x="55" y="104" width="46" height="46" rx="13" fill="#176b5b"/><text x="70" y="135" font-size="22" font-weight="700" fill="#fff">G</text><text x="115" y="135" font-size="24" font-weight="700" fill="#fff">GPE.</text>
    <text x="58" y="312" font-size="11" font-weight="700" letter-spacing="2" fill="#8dd6be">GESTION DU PATRIMOINE DE L’ÉTAT</text>
    <text x="58" y="370" font-size="32" font-weight="700" fill="#fff">Un accès sécurisé</text><text x="58" y="410" font-size="32" font-weight="700" fill="#fff">à votre espace.</text>
    <text x="58" y="462" font-size="15" fill="#c7d2df">Connectez-vous avec un compte administrateur</text><text x="58" y="487" font-size="15" fill="#c7d2df">pour gérer les utilisateurs du patrimoine.</text>
    <text x="58" y="795" font-size="12" fill="#9baabd">Jeton d’accès · expiration après 8 heures</text>
    <text x="590" y="200" class="h1">Connexion</text><text x="590" y="230" class="body">Saisissez les identifiants de votre compte.</text>
    <text x="590" y="302" class="h2">Adresse email</text><rect x="590" y="318" width="385" height="52" rx="10" fill="#fff" stroke="#cad4de"/><text x="608" y="350" class="small">nom@organisation.gouv</text>
    <text x="590" y="420" class="h2">Mot de passe</text><rect x="590" y="436" width="385" height="52" rx="10" fill="#fff" stroke="#cad4de"/><text x="608" y="468" class="small">••••••••••••</text>
    <rect x="590" y="526" width="385" height="52" rx="11" fill="#176b5b"/><text x="735" y="558" class="btn">Se connecter</text>
    <text x="590" y="630" class="small">Les messages d’erreur sont affichés ici sans révéler</text><text x="590" y="650" class="small">si l’adresse email est enregistrée.</text>
    <text x="590" y="720" class="body">←  Retour au tableau de bord</text>
  </g>
</svg>
